# Central list of permanent public URL migrations.
location = /services/eco-design { return 301 /services/ecological-documents; }
location = /services/laboratory { return 301 /services/laboratory-tests; }
location = /services/permits { return 301 /services/environmental-permits; }
location = /services/landfill { return 301 /services/poligon-tbo; }
location = /services/enterprise-support { return 301 /services/ecological-support; }
location = /shtrafy-za-ekologiyu-kazakhstan { return 301 /news/shtrafy-za-ekologicheskie-narusheniya; }
location = /shtrafy-za-ekologicheskie-narusheniya-kazakhstan { return 301 /news/shtrafy-za-ekologicheskie-narusheniya; }
location = /news/kakie-shtrafy-za-ekologiyu-v-kazakhstane { return 301 /news/shtrafy-za-ekologicheskie-narusheniya; }
location = /news/komu-nuzhen-proizvodstvennyy-kontrol-ses { return 301 /news/chto-takoe-proizvodstvennyy-ekologicheskiy-kontrol; }
location = /news/kak-poluchit-razreshenie-na-emissii { return 301 /news/ekologicheskie-dokumenty-too-kazakhstan; }
location = /news/chto-takoe-pasport-othodov { return 301 /news/dokumenty-peredachi-othodov; }
location = /news/kakie-dokumenty-proveryaet-ses { return 301 /news/podgotovka-k-ekologicheskoy-proverke; }
location = /news/ekologicheskoe-soprovozhdenie-biznesa { return 301 /news/chto-sdavat-po-ekologii-kazhdyy-god; }
location = /passport-othodov-kazakhstan { return 301 /services/ecological-documents; }
location = /otchet-pek-kazakhstan { return 301 /services/report-pek; }

# Previous service × city slugs. Keep regional intent while consolidating on the
# current canonical naming scheme. Nginx only sees valid historical requests;
# generated sitemap and internal links contain destinations, never aliases.
location ~ ^/passport-othodov-([a-z-]+)$ { return 301 /pasport-othodov-$1; }
location ~ ^/otchet-pek-([a-z-]+)$ { return 301 /pek-$1; }
location ~ ^/ovos-skrining-vozdeystviya-([a-z-]+)$ { return 301 /ovos-$1; }
location ~ ^/razreshenie-na-emissii-([a-z-]+)$ { return 301 /ekologicheskoe-razreshenie-$1; }
location ~ ^/ekologicheskoe-proektirovanie-([a-z-]+)$ { return 301 /roos-$1; }
location ~ ^/proizvodstvennyy-kontrol-ses-([a-z-]+)$ { return 301 /szz-$1; }
location ~ ^/laboratornye-izmereniya-([a-z-]+)$ { return 301 /laboratornye-zamery-$1; }
location ~ ^/proekt-ndv-([a-z-]+)$ { return 301 /ndv-$1; }
location ~ ^/(?:programma-pek|razrabotka-pek|proizvodstvennyy-ekologicheskiy-kontrol)-([a-z-]+)$ { return 301 /pek-$1; }
location ~ ^/proekt-szz-([a-z-]+)$ { return 301 /szz-$1; }
location ~ ^/razdel-oos-([a-z-]+)$ { return 301 /roos-$1; }
location ~ ^/programma-upravleniya-othodami-([a-z-]+)$ { return 301 /puo-$1; }
location ~ ^/ekologicheskoe-razreshenie-na-vozdeystvie-([a-z-]+)$ { return 301 /ekologicheskoe-razreshenie-$1; }
