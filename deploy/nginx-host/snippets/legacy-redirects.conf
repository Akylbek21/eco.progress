# Central list of permanent public URL migrations. These locations deliberately
# accept trailing slashes and return an absolute canonical URL, so scheme, host,
# slash and path migrations are completed by a single response.
location ~ ^/services/eco-design/*$ { return 301 https://ecoprogress.kz/services/ecological-documents$is_args$args; }
location ~ ^/services/laboratory/*$ { return 301 https://ecoprogress.kz/services/laboratory-tests$is_args$args; }
location ~ ^/services/permits/*$ { return 301 https://ecoprogress.kz/services/environmental-permits$is_args$args; }
location ~ ^/services/landfill/*$ { return 301 https://ecoprogress.kz/services/poligon-tbo$is_args$args; }
location ~ ^/services/enterprise-support/*$ { return 301 https://ecoprogress.kz/services/ecological-support$is_args$args; }
location ~ ^/shtrafy-za-ekologiyu-kazakhstan/*$ { return 301 https://ecoprogress.kz/news/shtrafy-za-ekologicheskie-narusheniya$is_args$args; }
location ~ ^/shtrafy-za-ekologicheskie-narusheniya-kazakhstan/*$ { return 301 https://ecoprogress.kz/news/shtrafy-za-ekologicheskie-narusheniya$is_args$args; }
location ~ ^/news/kakie-shtrafy-za-ekologiyu-v-kazakhstane/*$ { return 301 https://ecoprogress.kz/news/shtrafy-za-ekologicheskie-narusheniya$is_args$args; }
location ~ ^/news/komu-nuzhen-proizvodstvennyy-kontrol-ses/*$ { return 301 https://ecoprogress.kz/news/chto-takoe-proizvodstvennyy-ekologicheskiy-kontrol$is_args$args; }
location ~ ^/news/kak-poluchit-razreshenie-na-emissii/*$ { return 301 https://ecoprogress.kz/news/ekologicheskie-dokumenty-too-kazakhstan$is_args$args; }
location ~ ^/news/chto-takoe-pasport-othodov/*$ { return 301 https://ecoprogress.kz/news/dokumenty-peredachi-othodov$is_args$args; }
location ~ ^/news/kakie-dokumenty-proveryaet-ses/*$ { return 301 https://ecoprogress.kz/news/podgotovka-k-ekologicheskoy-proverke$is_args$args; }
location ~ ^/news/ekologicheskoe-soprovozhdenie-biznesa/*$ { return 301 https://ecoprogress.kz/news/chto-sdavat-po-ekologii-kazhdyy-god$is_args$args; }
location ~ ^/passport-othodov-kazakhstan/*$ { return 301 https://ecoprogress.kz/services/waste-passport$is_args$args; }
location ~ ^/otchet-pek-kazakhstan/*$ { return 301 https://ecoprogress.kz/services/report-pek$is_args$args; }

# Previous service × city slugs. Keep regional intent while consolidating on the
# current canonical naming scheme. Nginx only sees valid historical requests;
# generated sitemap and internal links contain destinations, never aliases.
location ~ ^/passport-othodov-([a-z-]+)/*$ { return 301 https://ecoprogress.kz/pasport-othodov-$1$is_args$args; }
location ~ ^/ovos-skrining-vozdeystviya-([a-z-]+)/*$ { return 301 https://ecoprogress.kz/ovos-$1$is_args$args; }
location ~ ^/razreshenie-na-emissii-([a-z-]+)/*$ { return 301 https://ecoprogress.kz/ekologicheskoe-razreshenie-$1$is_args$args; }
location ~ ^/ekologicheskoe-proektirovanie-([a-z-]+)/*$ { return 301 https://ecoprogress.kz/roos-$1$is_args$args; }
location ~ ^/proizvodstvennyy-kontrol-ses-([a-z-]+)/*$ { return 301 https://ecoprogress.kz/proizvodstvennyy-kontrol-$1$is_args$args; }
location ~ ^/laboratornye-izmereniya-([a-z-]+)/*$ { return 301 https://ecoprogress.kz/laboratornye-zamery-$1$is_args$args; }
location ~ ^/proekt-ndv-([a-z-]+)/*$ { return 301 https://ecoprogress.kz/ndv-$1$is_args$args; }
location ~ ^/(?:programma-pek|razrabotka-pek|proizvodstvennyy-ekologicheskiy-kontrol)-([a-z-]+)/*$ { return 301 https://ecoprogress.kz/pek-$1$is_args$args; }
location ~ ^/proekt-szz-([a-z-]+)/*$ { return 301 https://ecoprogress.kz/szz-$1$is_args$args; }
location ~ ^/razdel-oos-([a-z-]+)/*$ { return 301 https://ecoprogress.kz/roos-$1$is_args$args; }
location ~ ^/programma-upravleniya-othodami-([a-z-]+)/*$ { return 301 https://ecoprogress.kz/puo-$1$is_args$args; }
location ~ ^/ekologicheskoe-razreshenie-na-vozdeystvie-([a-z-]+)/*$ { return 301 https://ecoprogress.kz/ekologicheskoe-razreshenie-$1$is_args$args; }
