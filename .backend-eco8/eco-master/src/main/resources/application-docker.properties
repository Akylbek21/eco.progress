# Docker / production — все значения здесь, без .env на сервере

spring.datasource.url=jdbc:mysql://mysql:3306/eco?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=eco
spring.datasource.password=ecopass

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=false

# Spring Boot 4: URI в spring.mongodb.* (spring.data.mongodb.uri игнорируется драйвером)
spring.mongodb.uri=mongodb://eco:ecopass@mongo:27017/eco?authSource=admin&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

eco.security.jwt.secret=ecoprogress-production-jwt-secret-min-32-chars-2026
eco.security.jwt.ttl-hours=24

eco.cors.allowed-origins=*

eco.storage.backend=auto
eco.storage.directory=/app/uploads

eco.mail.enabled=true
eco.mail.from=eco.progresss@gmail.com
eco.mail.poll-interval-ms=15000
eco.mail.max-attempts=5

eco.signature.require-cms=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=eco.progresss@gmail.com
spring.mail.password=tadfhwatflpgxxhk
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Меньше шума при старте (grep по [ECO-STARTUP] для проверки конфигурации)
logging.level.org.springframework.data.repository.config=WARN
logging.level.kz.eco.config.DockerStartupReport=WARN
