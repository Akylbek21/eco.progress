spring.application.name=eco

server.port=8080
server.servlet.context-path=/

spring.datasource.url=jdbc:h2:file:./data/ecodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

spring.mongodb.uri=mongodb://localhost:27017/eco
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

eco.security.jwt.secret=${ECO_JWT_SECRET:change-me-please-32-chars-minimum-secret-key-1234567890}
eco.security.jwt.ttl-hours=${ECO_JWT_TTL_HOURS:24}

eco.cors.allowed-origins=${ECO_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://localhost,http://localhost:80,https://ecoprogress.kz}

eco.uploads.dir=${ECO_UPLOADS_DIR:./data/uploads}

eco.mail.enabled=${ECO_MAIL_ENABLED:true}
eco.mail.from=${ECO_MAIL_FROM:eco.progresss@gmail.com}
eco.mail.poll-interval-ms=${ECO_MAIL_POLL_MS:15000}
eco.mail.max-attempts=${ECO_MAIL_MAX_ATTEMPTS:5}

eco.signature.require-cms=${ECO_SIGNATURE_REQUIRE_CMS:true}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:eco.progresss@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:tadfhwatflpgxxhk}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true