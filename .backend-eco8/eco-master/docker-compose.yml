services:
  mysql:
    image: mysql:8.4
    container_name: eco-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: eco
      MYSQL_USER: eco
      MYSQL_PASSWORD: ecopass
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=48M
      - --innodb-log-buffer-size=4M
      - --innodb-redo-log-capacity=16M
      - --key-buffer-size=4M
      - --tmp-table-size=8M
      - --max-heap-table-size=8M
      - --sort-buffer-size=256K
      - --read-buffer-size=128K
      - --read-rnd-buffer-size=256K
      - --join-buffer-size=256K
      - --thread-cache-size=4
      - --table-open-cache=64
      - --max-connections=30
      - --performance-schema=OFF
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks: [eco]

  phpmyadmin:
    image: phpmyadmin:5
    container_name: eco-phpmyadmin
    restart: unless-stopped
    profiles: [tools]
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "127.0.0.1:8083:80"
    mem_limit: 64m
    networks: [eco]

  mongo:
    image: mongo:7
    container_name: eco-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: eco
      MONGO_INITDB_ROOT_PASSWORD: ecopass
      MONGO_INITDB_DATABASE: eco
    command: ["--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "mongosh", "-u", "eco", "-p", "ecopass", "--authenticationDatabase", "admin", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks: [eco]

  mongo-express:
    image: mongo-express:1
    container_name: eco-mongo-express
    restart: unless-stopped
    profiles: [tools]
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: eco
      ME_CONFIG_MONGODB_ADMINPASSWORD: ecopass
      ME_CONFIG_MONGODB_URL: mongodb://eco:ecopass@mongo:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "127.0.0.1:8082:8081"
    mem_limit: 64m
    networks: [eco]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: eco-backend:latest
    container_name: eco-app
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JAVA_OPTS: >-
        -Xms192m -Xmx384m -XX:+UseSerialGC -XX:MaxMetaspaceSize=160m
        -Dspring.profiles.active=docker
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads
    mem_limit: 512m
    networks: [eco]

volumes:
  mysql-data:
  mongo-data:
  uploads-data:

networks:
  eco:
    name: eco-net
    driver: bridge
