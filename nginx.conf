map $http_x_forwarded_proto $redirect_to_https {
    default 1;
    https 0;
}

server {
    listen 80;
    server_name www.ecoprogress.kz;

    include /etc/nginx/snippets/legacy-redirects.conf;
    include /etc/nginx/snippets/service-city-fallbacks.generated.conf;

    location ~ ^(.+[^/])/+$ {
        return 301 https://ecoprogress.kz$1$is_args$args;
    }

    location / {
        return 301 https://ecoprogress.kz$request_uri;
    }
}

server {
    listen 80 default_server;
    server_name ecoprogress.kz _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/legacy-redirects.conf;
    include /etc/nginx/snippets/service-city-fallbacks.generated.conf;

    location ~ ^(.+[^/])/+$ {
        return 301 https://ecoprogress.kz$1$is_args$args;
    }

    location /api/ {
        if ($redirect_to_https) {
            return 301 https://ecoprogress.kz$request_uri;
        }

        add_header X-Robots-Tag "noindex, nofollow" always;
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend "${BACKEND_URL}";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }

    location ~ ^/(cabinet|client|staff|admin|dashboard|internal|document-flow|sign|public/document-flow/sign)(/|$) {
        if ($redirect_to_https) {
            return 301 https://ecoprogress.kz$request_uri;
        }

        try_files $uri $uri/index.html /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location ~ ^/(login|register|reset-password)$ {
        if ($redirect_to_https) {
            return 301 https://ecoprogress.kz$request_uri;
        }

        try_files $uri $uri/index.html /index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    location / {
        if ($redirect_to_https) {
            return 301 https://ecoprogress.kz$request_uri;
        }

        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header X-Robots-Tag "noindex, follow" always;
    }

    # Vite fingerprints files under /assets/, so they can be cached immutably.
    location /assets/ {
        if ($redirect_to_https) {
            return 301 https://ecoprogress.kz$request_uri;
        }

        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Public media names are stable but may be replaced by a later deployment.
    location ~* \.(?:png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        if ($redirect_to_https) {
            return 301 https://ecoprogress.kz$request_uri;
        }

        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1000;
}
