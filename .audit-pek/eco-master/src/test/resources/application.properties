spring.datasource.url=jdbc:h2:mem:ecotest;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false
spring.flyway.enabled=false

eco.security.jwt.secret=test-jwt-secret-minimum-32-characters-long
eco.security.jwt.ttl-hours=24
eco.cors.allowed-origins=http://localhost:5173
eco.public.base-url=https://ecoprogress.kz
eco.signature.require-cms=false
# Test environment has no LibreOffice - every generated PDF is the OpenPDF fallback renderer.
# Production defaults to blocking fallback-PDF signing (see ProtocolSigningProperties); tests that
# specifically cover that guard override this back to true via @TestPropertySource.
protocol.signing.block-fallback-pdf=false
eco.storage.backend=filesystem
eco.uploads.dir=./target/test-uploads

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

document-flow.internal-mode=true
