spring.application.name=eco

server.port=8080
server.servlet.context-path=/

spring.datasource.url=jdbc:h2:file:./data/ecodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

spring.mongodb.uri=mongodb://localhost:27017/eco
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

eco.security.jwt.secret=${ECO_JWT_SECRET:}
eco.security.jwt.ttl-hours=${ECO_JWT_TTL_HOURS:24}

eco.cors.allowed-origins=${ECO_CORS_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:3000,http://localhost,http://localhost:80,https://ecoprogress.kz}

# Canonical public origin used to build self-canonical URLs, sitemap.xml entries and JSON-LD.
eco.public.base-url=${ECO_PUBLIC_BASE_URL:https://ecoprogress.kz}

eco.uploads.dir=${ECO_UPLOADS_DIR:./data/uploads}

eco.mail.enabled=${ECO_MAIL_ENABLED:true}
eco.mail.from=${ECO_MAIL_FROM:eco.progresss@gmail.com}
eco.mail.poll-interval-ms=${ECO_MAIL_POLL_MS:15000}
eco.mail.max-attempts=${ECO_MAIL_MAX_ATTEMPTS:5}

eco.signature.require-cms=${ECO_SIGNATURE_REQUIRE_CMS:true}

# Certificate hardening (module: Подписание документов, item 5) - chain/CRL/OCSP all disabled by
# default (no trust store/CRL/OCSP infra ships with this project) so today's signing behavior is
# unchanged; each check honestly reports NOT_CONFIGURED rather than a false "passed" until an
# operator supplies real values. See kz.eco.signature.verification.CertificateVerificationService.
eco.signature.trust-store.path=${ECO_SIGNATURE_TRUST_STORE_PATH:}
eco.signature.trust-store.password=${ECO_SIGNATURE_TRUST_STORE_PASSWORD:}
eco.signature.trust-store.type=${ECO_SIGNATURE_TRUST_STORE_TYPE:PKCS12}
eco.signature.crl.enabled=${ECO_SIGNATURE_CRL_ENABLED:false}
eco.signature.crl.timeout-ms=${ECO_SIGNATURE_CRL_TIMEOUT_MS:5000}
eco.signature.ocsp.enabled=${ECO_SIGNATURE_OCSP_ENABLED:false}
eco.signature.ocsp.timeout-ms=${ECO_SIGNATURE_OCSP_TIMEOUT_MS:5000}

# PEK Iteration 4: automated collection/notification scheduler pass interval (fixedDelay, matches
# the project's existing @Scheduled convention - see EmailOutboxProcessor/
# DocumentFlowNotificationOutboxProcessor). Kept long by default since a full pass is not cheap;
# tests override this via a very large value or trigger PekCollectionScheduler#manualRun directly.
eco.pek.scheduler.interval-ms=${ECO_PEK_SCHEDULER_INTERVAL_MS:3600000}

# Signature Documents feature (kz.eco.signaturedoc): 25MB default per-file business limit, equal to
# the raw spring.servlet.multipart.max-file-size above (both 25MB/26214400 bytes) so the two limits
# never disagree - the business-level check still runs first for files within the limit and returns
# a clean FILE_TOO_LARGE error code; only a file that already exceeds the raw multipart ceiling is
# rejected by the servlet layer itself.
eco.signaturedoc.max-file-size-bytes=${ECO_SIGNATUREDOC_MAX_FILE_SIZE_BYTES:26214400}
# Signing-session TTL (module spec: short-lived prepare-signing session).
eco.signaturedoc.signing-session-ttl-minutes=${ECO_SIGNATUREDOC_SESSION_TTL_MINUTES:15}

# CRM document library (kz.eco.documentlibrary): 20MB default per-file business limit, same
# rationale as eco.signaturedoc.max-file-size-bytes above (independent of, and stricter-checked
# than, the raw spring.servlet.multipart.max-file-size, which is already 30MB).
eco.documentlibrary.max-file-size-bytes=${ECO_DOCUMENTLIBRARY_MAX_FILE_SIZE_BYTES:20971520}

# DEV/TEST bypass for the paid "Документооборот" module - see DocumentFlowTestAccessGuard,
# which refuses to start if test-mode-enabled resolves true under the docker (production) profile.
document-flow.access.test-mode-enabled=${DOCUMENT_FLOW_TEST_MODE:false}
document-flow.access.allowed-user-ids=${DOCUMENT_FLOW_TEST_USER_IDS:}
document-flow.access.allowed-emails=${DOCUMENT_FLOW_TEST_EMAILS:}
document-flow.access.allowed-organization-ids=${DOCUMENT_FLOW_TEST_ORGANIZATION_IDS:}
document-flow.signing.mock-enabled=${DOCUMENT_FLOW_MOCK_SIGNING:false}
document-flow.storage.mock-antivirus-enabled=${DOCUMENT_FLOW_MOCK_ANTIVIRUS:false}

# Internal-mode: EcoProgress's own staff use the module against one fixed internal organization,
# no per-request organizationId or commercial subscription required (see OrganizationResolver).
# document-flow.default-organization-id is NOT set here on purpose (a Long property can't safely
# default to an empty placeholder) - when DOCUMENT_FLOW_DEFAULT_ORGANIZATION_ID is exported as a
# real OS env var, Spring Boot's relaxed binding picks it up for this @ConfigurationProperties bean
# automatically; when it isn't set, OrganizationResolver falls back to looking the bootstrap
# company up by name ('EcoProgress', created by V58__document_flow_internal_mode_bootstrap.sql).
# Production should still export the env var explicitly rather than rely on the name lookup.
document-flow.internal-mode=${DOCUMENT_FLOW_INTERNAL_MODE:true}

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:eco.progresss@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true