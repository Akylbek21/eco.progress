# Docker / production — секреты берутся ТОЛЬКО из окружения (docker-compose env / secret storage).

spring.datasource.url=jdbc:mysql://mysql:3306/eco?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eco}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=2
spring.flyway.validate-on-migrate=false
spring.flyway.locations=classpath:db/migration

spring.h2.console.enabled=false

# Spring Boot 4: URI в spring.mongodb.* (spring.data.mongodb.uri игнорируется драйвером)
spring.mongodb.uri=mongodb://${MONGO_USERNAME:eco}:${MONGO_PASSWORD:}@mongo:27017/eco?authSource=admin&serverSelectionTimeoutMS=5000&connectTimeoutMS=5000
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB

eco.security.jwt.secret=${ECO_JWT_SECRET:}
eco.security.jwt.ttl-hours=24

eco.cors.allowed-origins=${ECO_CORS_ORIGINS:https://ecoprogress.kz,https://www.ecoprogress.kz}

eco.public.base-url=${ECO_PUBLIC_BASE_URL:https://ecoprogress.kz}

eco.storage.backend=auto
eco.storage.directory=/app/uploads

eco.mail.enabled=true
eco.mail.from=eco.progresss@gmail.com
eco.mail.poll-interval-ms=15000
eco.mail.max-attempts=5

eco.signature.require-cms=true

# P0 module fix (Подписание документов item 1): production must be fail-closed - a signature
# whose certificate trust chain/CRL/OCSP status genuinely cannot be established (NOT_CONFIGURED or
# CHECK_ERROR, not just an explicit REVOKED) is rejected outright rather than silently accepted.
# This makes eco.signature.trust-store.path/crl.enabled/ocsp.enabled effectively REQUIRED in this
# profile: until an operator provisions a real trust store and enables CRL/OCSP, every submitted
# signature fails CERTIFICATE_TRUST_NOT_VERIFIED - by design, since accepting a signature with an
# unverifiable trust chain is exactly the hole this flag closes. See
# kz.eco.signature.verification.CertificateVerificationResult#trustFullyVerified.
eco.signature.strict-verification-required=true
eco.signature.crl.enabled=true
eco.signature.ocsp.enabled=true

# Production: DEV/TEST document-flow bypass is always off here, independent of any env var -
# DocumentFlowTestAccessGuard also refuses to start if this were ever true under this profile.
document-flow.access.test-mode-enabled=false
document-flow.access.allowed-user-ids=
document-flow.access.allowed-emails=
document-flow.access.allowed-organization-ids=
document-flow.signing.mock-enabled=false
document-flow.storage.mock-antivirus-enabled=false

# Internal-mode: set DOCUMENT_FLOW_DEFAULT_ORGANIZATION_ID explicitly in production (picked up
# automatically by Spring Boot's relaxed env-var binding for this @ConfigurationProperties bean -
# never hardcode the id in Java). If unset, OrganizationResolver falls back to looking up the
# company named 'EcoProgress' (see V58__document_flow_internal_mode_bootstrap.sql).
document-flow.internal-mode=${DOCUMENT_FLOW_INTERNAL_MODE:true}

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Меньше шума при старте (grep по [ECO-STARTUP] для проверки конфигурации)
logging.level.org.springframework.data.repository.config=WARN
logging.level.kz.eco.config.DockerStartupReport=WARN
