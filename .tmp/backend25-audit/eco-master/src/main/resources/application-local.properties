# Явно локальный профиль разработки: запуск с -Dspring.profiles.active=local
# Только здесь допустимы dev-значения по умолчанию. Значения ниже не являются секретами
# и НЕ должны использоваться в docker/production (там ECO_JWT_SECRET обязателен из окружения).

eco.security.jwt.secret=${ECO_JWT_SECRET:local-development-only-jwt-secret-not-for-production-0001}
