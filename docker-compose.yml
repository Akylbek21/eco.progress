services:
  frontend:
    build:
      context: .
      args:
        # The current backend has no aggregate SEO snapshot endpoint. Keep the
        # build offline by default and use the committed fail-closed snapshots.
        # Set SEO_CONTENT_API_URL explicitly once that endpoint is deployed.
        SEO_CONTENT_API_URL: ${SEO_CONTENT_API_URL:-}
        SEO_CONTENT_API_TOKEN: ${SEO_CONTENT_API_TOKEN:-}
    container_name: eco-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://eco-app:8080}
    restart: unless-stopped
    networks:
      - eco

networks:
  eco:
    external: true
    name: eco-net
