services:
  frontend:
    build:
      context: .
      network: eco-net
      args:
        SEO_CONTENT_API_URL: ${SEO_CONTENT_API_URL:-http://eco-app:8080/api/public/content/seo-snapshot}
        SEO_CONTENT_API_TOKEN: ${SEO_CONTENT_API_TOKEN:-}
    container_name: eco-frontend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    environment:
      - BACKEND_URL=${BACKEND_URL:-http://eco-app:8080}
    restart: unless-stopped
    networks:
      - eco

networks:
  eco:
    external: true
    name: eco-net
